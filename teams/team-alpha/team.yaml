team: team-alpha
lead: Артем
timezone: Europe/Moscow
current_okr: okr/2026-Q2.yaml
lead_notes: lead-notes.md
personal_okrs_notes: personal-okrs/

# Конфиг Jira-трекера. project_prefix — константа, которую скиллы подставляют,
# когда в дейлике называют задачу одним номером (например "закрыл 103" → TASK-103).
# Если в реплике явно назван другой префикс (BILL-45) — используется он, а не константа.
# Подключение к Jira (хост, токен) настраивается в MCP-клиенте, не здесь.
jira:
 project_prefix: TASK

# aliases (опционально) — альтернативные написания имени в транскрипциях
# («Ваня», «Иван П.»). Скилл process-daily нормализует имена к members[*].name,
# а check_protocol.py учитывает aliases, чтобы не ругаться, что нормализованного
# имени нет в raw.md. Разница е/ё («Пётр» vs «Петр») учитывается автоматически.
members:
 - name: Артем
   role: Тимлид
   focus: архитектура, координация, релизы

 - name: Иван
   role: Backend-разработчик
   focus: API, интеграции, вебхуки
   aliases: [Ваня]

 - name: Мария
   role: Frontend-разработчик
   focus: UI компоненты, формы, отчёты

 - name: Петр
   role: Backend-разработчик
   focus: billing, observability, метрики

 - name: Алина
   role: QA-инженер
   focus: e2e тесты, автоматизация тестирования

modules:
 - name: api-gateway
   description: Внешний API, REST-эндпоинты, аутентификация
   knowledge: Основной — Иван. Архитектурные решения — Артем.

 - name: billing
   description: Тарификация, счета, интеграция с платёжными провайдерами
   knowledge: Глубоко — Петр. Интеграционная часть — Иван (поверхностно).

 - name: webhooks
   description: Доставка событий во внешние системы, retry, DLQ
   knowledge: Иван. Петр может подхватить при необходимости.

 - name: observability
   description: Метрики, логирование, алерты, дашборды
   knowledge: Петр (owner de facto). Остальные — пользователи.

 - name: ui-reports
   description: UI отчётов и форм в админке
   knowledge: Мария. Никто больше глубоко не знает.

 - name: e2e-tests
   description: Автотесты сквозных сценариев, CI-пайплайн тестов
   knowledge: Алина. Артем помогал с инфраструктурой CI.
